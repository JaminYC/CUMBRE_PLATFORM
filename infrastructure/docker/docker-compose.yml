services:
  postgres:
    image: postgres:16-alpine
    container_name: cumbre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cumbre
      POSTGRES_USER: cumbre
      POSTGRES_PASSWORD: cumbrepass
    ports:
      - "5432:5432"
    volumes:
      - cumbre_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cumbre -d cumbre"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cumbre_postgres_data:
